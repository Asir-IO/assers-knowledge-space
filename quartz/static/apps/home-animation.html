<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Home Animation</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
    <style>
      body {
        margin: 0;
        justify-content: center;
        align-items: center;
        background-color: transparent;
      }
      canvas {
        width: 100vw !important;
        height: 100vh !important;
      }
    </style>
  </head>
  <body>
    <script>
      let bitmask = 0
      let rows = 13
      let cols = 59
      let areaWidth = 16
      let areaHeight = 16
      let dataMax, dataMin
      let grid = []
      let displayGrid = []
      let table = [0, -16, -8, -4, 1, 3, 7, 15, -1]
      let cvs
      let offset = 0
      let speed = 1
      let k = 0

      const targetShape = [
        "                                                           ",
        "                                                           ",
        "                                                           ",
        "                                                           ",
        "         #   # ### #   ### ### #   # ###        #          ",
        "         #   # #   #   #   # # ## ## #      ###  #         ",
        "         # # # ### #   #   # # # # # ###         #         ",
        "         ## ## #   #   #   # # #   # #      ###  #         ",
        "         #   # ### ### ### ### #   # ###        #          ",
        "                                                           ",
        "                                                           ",
        "                                                           ",
        "                                                           ",
      ]

      function setup() {
        pixelDensity(1)
        cvs = createCanvas(cols * areaWidth, rows * areaHeight)
        cvs.style("image-rendering", "pixelated")
        noSmooth()
        noStroke()

        let a = 1
        while (a < areaWidth || a < areaHeight) {
          a <<= 1
        }
        dataMax = a - 1
        dataMin = ~dataMax

        for (let i = 0; i < rows * cols; i++) {
          let dx = i % cols
          let dy = (i / cols) | 0
          grid.push(noise(dx * 0.1, dy * 0.1) * table.length)
          displayGrid.push(0)
        }

        frameRate(16)
        background(0)
        loadPixels()
        drawAll()
        updatePixels()
      }

      function draw() {
        background(0)

        if ((frameCount & 127) == 0) {
          k++
          if (k >= 4) k -= 4
        }
        speed = 1 << k
        offset = 0.06 * speed
        let maxD1 = 1
        let grid1 = grid.slice()

        for (let i = 0; i < rows * cols; i++) {
          let dx = i % cols
          let dy = Math.floor(i / cols)
          let neightbor = []
          let value1 = grid[i]

          if (i % cols > 0) neightbor.push(grid[i - 1] - value1)
          if (i % cols < cols - 1) neightbor.push(grid[i + 1] - value1)
          if (i >= cols) neightbor.push(grid[i - cols] - value1)
          if (i < cols * (rows - 1)) neightbor.push(grid[i + cols] - value1)

          let maxDifference = max(neightbor)
          let minDifference = min(neightbor)
          let a = offset * noise(frameCount * 0.15 + dx * 0.12 + dy * cols * 0.12)
          let aMax = Math.min(-minDifference - maxD1, maxD1)
          let aMin = Math.max(maxDifference - maxD1, 0)

          if (aMin >= aMax) {
            a = Math.max(aMin, a)
          } else {
            a = Math.min(aMax, a)
          }
          grid1[i] = grid[i] + a
        }
        grid = grid1.slice()

        // The Loop to gather and form the Target shape
        let cycle = frameCount % 400
        let gatherAmount = 0

        if (cycle < 100) gatherAmount = 0
        else if (cycle < 150)
          gatherAmount = (cycle - 100) / 50 // Target forms
        else if (cycle < 250)
          gatherAmount = 1 // Hold the Target
        else if (cycle < 300)
          gatherAmount = 1 - (cycle - 250) / 50 // Target dissolves
        else gatherAmount = 0 // Pure terrain

        // Easing function makes the transition look smooth instead of robotic
        gatherAmount = gatherAmount * gatherAmount * (3 - 2 * gatherAmount)

        // Blend the simulation into the target text
        for (let y = 0; y < rows; y++) {
          for (let x = 0; x < cols; x++) {
            let idx = y * cols + x
            let simVal = grid[idx]

            let charMap = targetShape[y].charAt(x)
            let targetVal = charMap === "#" ? 8.99 : 0.01

            // Interpolate between the chaotic noise and the perfect text
            displayGrid[idx] = simVal * (1 - gatherAmount) + targetVal * gatherAmount
          }
        }

        loadPixels()
        drawAll()
        updatePixels()
      }

      function drawAll() {
        for (let x = 0; x < cols; x++) {
          for (let y = 0; y < rows; y++) {
            drawPattern(x, y)
          }
        }
      }

      function drawPattern(x, y) {
        let index = Math.floor(displayGrid[y * cols + x]) % table.length
        if (index < 0) {
          index = 0
        } else if (index >= table.length) {
          index = table.length - 1
        }
        let a = table[index]
        let sign = a >= 0 ? 1 : -1
        drawPattern1(x * areaWidth, y * areaHeight, areaWidth, areaHeight, a, sign)
      }

      function drawPattern1(x0, y0, areaWidth, areaHeight, bitmask, sign) {
        let colorZero
        let colorOne
        if (sign == 1) {
          colorZero = 0xffffff
          colorOne = 0
        } else {
          colorZero = 0
          colorOne = 0xffffff
          bitmask = ~bitmask
        }

        for (let i = 0; i < areaWidth * areaHeight; i++) {
          let dx = i % areaWidth
          let dy = Math.floor(i / areaWidth)
          let result = (dx ^ dy) & bitmask

          let color1 = result != 0 ? colorOne : colorZero

          let rowWidth = cols * areaWidth
          let whichPixel = ((y0 + dy) * rowWidth + x0 + dx) * 4

          pixels[whichPixel] = (color1 >> 16) & 255
          pixels[whichPixel + 1] = (color1 >> 8) & 255
          pixels[whichPixel + 2] = color1 & 255
          pixels[whichPixel + 3] = 255
        }
      }
    </script>
  </body>
</html>
